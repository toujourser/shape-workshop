<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>形状工坊 · 几何体原型</title>
<style>
:root{--bg:#e8f2ff;--panel:#fff;--ink:#1b2a49;--muted:#5b6b8c;--line:#cfe0f7;--pick:#2f6df6}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;display:grid;grid-template-columns:200px 1fr 300px;gap:16px;padding:16px}
h1{font-size:20px;margin:0 0 12px}
.panel{background:var(--panel);border-radius:18px;padding:16px;border:2px solid var(--line)}
#shapes{display:flex;flex-direction:column;gap:10px}
#shapes button{font:inherit;font-size:18px;font-weight:600;padding:14px;border-radius:14px;border:2px solid var(--line);background:#f6faff;color:var(--ink);cursor:pointer;text-align:left}
#shapes button[aria-pressed=true]{border-color:var(--pick);background:#e4edff}
#shapes button:focus-visible,input:focus-visible{outline:3px solid var(--pick);outline-offset:2px}
#stage{position:relative;border-radius:18px;background:#f6faff;border:2px solid var(--line);overflow:hidden;min-height:320px;touch-action:none;cursor:grab}
#stage canvas{display:block;width:100%;height:100%}
#hint{position:absolute;left:14px;bottom:10px;font-size:13px;color:var(--muted)}
label{display:block;font-weight:600;margin:14px 0 4px}
label output{float:right;color:var(--pick)}
input[type=range]{width:100%}
.result{margin-top:18px;padding:14px;border-radius:14px;background:#f1f6ff}
.result p{margin:0 0 4px;color:var(--muted);font-size:14px}
.result .f{font-size:15px;margin-bottom:2px}
.result .n{font-size:26px;font-weight:700;margin-bottom:12px}
.result .n:last-child{margin-bottom:0}
@media(max-width:820px){body{grid-template-columns:1fr;grid-template-rows:auto 320px auto;height:auto}#shapes{flex-direction:row;flex-wrap:wrap}}
</style>
</head>
<body>
<section class="panel">
  <h1>形状工坊</h1>
  <div id="shapes" role="group" aria-label="选择形状"></div>
</section>
<main id="stage"><span id="hint">拖动画面，转一转</span></main>
<section class="panel">
  <div id="sliders"></div>
  <div class="result">
    <p>体积</p><div class="f" id="fv"></div><div class="n" id="nv"></div>
    <p>表面积</p><div class="f" id="fs"></div><div class="n" id="ns"></div>
  </div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const PI = Math.PI;
const SHAPES = {
  cube:{name:'立方体',color:0x2f6df6,params:{a:'边长'},
    geo:p=>new THREE.BoxGeometry(p.a,p.a,p.a),
    vol:p=>p.a**3,area:p=>6*p.a**2,fv:'V = a × a × a',fs:'S = 6 × a × a'},
  cylinder:{name:'圆柱',color:0x16a085,params:{r:'底面半径',h:'高'},
    geo:p=>new THREE.CylinderGeometry(p.r,p.r,p.h,48),
    vol:p=>PI*p.r**2*p.h,area:p=>2*PI*p.r*(p.r+p.h),fv:'V = π × r² × h',fs:'S = 2π × r × (r + h)'},
  cone:{name:'圆锥',color:0xf5a623,params:{r:'底面半径',h:'高'},
    geo:p=>new THREE.ConeGeometry(p.r,p.h,48),
    vol:p=>PI*p.r**2*p.h/3,area:p=>PI*p.r*(p.r+Math.hypot(p.r,p.h)),fv:'V = ⅓ × π × r² × h',fs:'S = π × r × (r + 斜边)'},
  sphere:{name:'球',color:0xe0508a,params:{r:'半径'},
    geo:p=>new THREE.SphereGeometry(p.r,48,32),
    vol:p=>4/3*PI*p.r**3,area:p=>4*PI*p.r**2,fv:'V = ⁴⁄₃ × π × r³',fs:'S = 4 × π × r²'}
};
const state={key:'cube',p:{a:4,r:3,h:5}};
const SCALE=0.45;

const stage=document.getElementById('stage');
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(45,1,0.1,100);
camera.position.set(0,2.5,9);camera.lookAt(0,0,0);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
stage.appendChild(renderer.domElement);
scene.add(new THREE.AmbientLight(0xffffff,0.7));
const sun=new THREE.DirectionalLight(0xffffff,0.8);sun.position.set(5,8,6);scene.add(sun);
const group=new THREE.Group();scene.add(group);
group.rotation.set(0.35,0.6,0);
let mesh,edges;

function rebuild(){
  const s=SHAPES[state.key];
  const scaled={};for(const k in state.p)scaled[k]=state.p[k]*SCALE;
  if(mesh){group.remove(mesh,edges);mesh.geometry.dispose();mesh.material.dispose();edges.geometry.dispose();edges.material.dispose();}
  const g=s.geo(scaled);
  mesh=new THREE.Mesh(g,new THREE.MeshStandardMaterial({color:s.color,roughness:0.5}));
  edges=new THREE.LineSegments(new THREE.EdgesGeometry(g,30),new THREE.LineBasicMaterial({color:0xffffff}));
  group.add(mesh,edges);
  const v=s.vol(state.p),a=s.area(state.p);
  fv.textContent=s.fv;fs.textContent=s.fs;
  nv.textContent=v.toFixed(1)+' 立方单位';ns.textContent=a.toFixed(1)+' 平方单位';
}

function buildSliders(){
  const s=SHAPES[state.key];
  const box=document.getElementById('sliders');box.innerHTML='';
  for(const k in s.params){
    const id='s_'+k;
    const l=document.createElement('label');l.htmlFor=id;
    l.innerHTML=s.params[k]+'<output>'+state.p[k]+'</output>';
    const i=document.createElement('input');
    Object.assign(i,{type:'range',id,min:1,max:8,step:0.5,value:state.p[k]});
    i.oninput=()=>{state.p[k]=+i.value;l.querySelector('output').textContent=i.value;rebuild();};
    box.append(l,i);
  }
}

function buildButtons(){
  const box=document.getElementById('shapes');
  for(const k in SHAPES){
    const b=document.createElement('button');
    b.textContent=SHAPES[k].name;b.setAttribute('aria-pressed',k===state.key);
    b.onclick=()=>{state.key=k;[...box.children].forEach(c=>c.setAttribute('aria-pressed',c===b));buildSliders();rebuild();};
    box.appendChild(b);
  }
}

let drag=null,spin=true;
stage.onpointerdown=e=>{drag=[e.clientX,e.clientY];spin=false;stage.setPointerCapture(e.pointerId);stage.style.cursor='grabbing';};
stage.onpointermove=e=>{if(!drag)return;
  group.rotation.y+=(e.clientX-drag[0])*0.01;group.rotation.x+=(e.clientY-drag[1])*0.01;drag=[e.clientX,e.clientY];};
stage.onpointerup=()=>{drag=null;stage.style.cursor='grab';};
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();}
addEventListener('resize',resize);
(function loop(){if(spin&&!reduce)group.rotation.y+=0.004;renderer.render(scene,camera);requestAnimationFrame(loop);})();

buildButtons();buildSliders();rebuild();resize();
</script>
</body>
</html>
